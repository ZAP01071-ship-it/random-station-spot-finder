<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Station & Spot Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;600;800&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/random-station-spot-finder/assets/index-DuUkaLu1.js"></script>
    <link rel="stylesheet" crossorigin href="/random-station-spot-finder/assets/index-BOKJFpdh.css">
  </head>
  <body>
    <div class="bg-animation">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <div class="container">
      <header>
        <h1>Spot Roulette</h1>
        <p>いつもの場所から、偶然の出会いを探そう。</p>
      </header>

      <main>
        <!-- 入力フォームエリア -->
        <section id="search-section" class="glass-card">
          <form id="search-form">
            <div class="form-group">
              <label for="location">出発する場所</label>
              <input type="text" id="location" placeholder="例: 東京駅、新宿、大阪城..." required />
            </div>
            <div class="form-group">
              <label for="distance">対象エリアの広さ（出発地からの距離 km）</label>
              <input type="number" id="distance" min="0.1" max="50" step="0.1" value="30" placeholder="例: 30" required />
            </div>
            <button type="submit" class="btn-primary" id="search-btn">
              <span class="btn-text">ルーレットを回す</span>
              <span class="btn-icon">🎲</span>
            </button>
          </form>
          <div id="error-message" class="error-msg hidden"></div>
        </section>

        <!-- ルーレットアニメーションエリア -->
        <section id="roulette-section" class="glass-card hidden">
          <div class="roulette-container">
            <h2 class="roulette-title">目的地を抽選中...</h2>
            <div class="roulette-window">
              <div id="roulette-strip" class="roulette-strip">
                <!-- 駅名がここにJSで挿入される -->
                <div class="roulette-item">検索中...</div>
              </div>
            </div>
            <p class="roulette-subtitle" id="roulette-status">30km圏内の駅を探しています</p>
          </div>
        </section>

        <!-- 結果表示エリア -->
        <section id="result-section" class="hidden">
          <div class="result-header glass-card">
            <h2 class="result-station">
              🎯 <span id="station-name-result">駅名</span> に決定！
            </h2>
            <div id="station-line-result" class="result-line hidden"></div>
            <p class="result-meta" id="station-distance-result">出発地から約--km</p>
            <button id="reset-btn" class="btn-secondary">もう一度探す</button>
          </div>

          <div class="spots-container">
            <h3 class="section-heading">🍽️ おすすめグルメ</h3>
            <div id="food-list" class="spot-grid">
              <!-- JSで挿入 -->
            </div>

            <h3 class="section-heading mt-lg">🎪 お出かけ・遊び場</h3>
            <div id="play-list" class="spot-grid">
              <!-- JSで挿入 -->
            </div>
          </div>
        </section>
      </main>
    </div>

  </body>
</html>
